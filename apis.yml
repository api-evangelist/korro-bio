aid: korro-bio
name: Korro Bio
description: >-
  Korro Bio, Inc. (Nasdaq: KRRO) is a Cambridge, Massachusetts clinical-stage biopharmaceutical
  company developing a new class of genetic medicines based on programmable RNA editing. Its
  proprietary OPERA (Oligonucleotide Promoted Editing of RNA) platform pairs data-driven
  oligonucleotide design and machine-learning optimization with linker chemistry and
  tissue-directed delivery to recruit the body's own ADAR enzymes and make a precise, transient
  single-base edit to a native mRNA transcript — editing RNA rather than DNA so the change is
  tunable and reversible. The company was created and incubated by Atlas Venture with New
  Enterprise Associates in October 2019, raised a $91.5M Series A and a $116M Series B, and became
  public in 2023 through a merger with Frequency Therapeutics alongside a $117M private placement.
  Its pipeline targets liver and central nervous system indications and includes KRRO-110 (the
  REWRITE Phase 1/2a study in alpha-1 antitrypsin deficiency), KRRO-111 and KRRO-121, which holds
  EMA orphan drug designation for urea cycle disorders. Korro Bio sells therapeutics, not software:
  it operates no developer program, publishes no API, SDK or machine-readable specification, and
  maintains no public source-code organization.
